<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accounting Equation Simulator — Complete Cycle</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#1a237e 0%,#283593 40%,#3949ab 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#gate{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:52px 44px;max-width:440px;width:100%;text-align:center;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
#gate h1{font-size:1.45rem;color:#1a1a2e;margin-bottom:6px;line-height:1.3}
#gate .icon{font-size:3.2rem;margin-bottom:18px;display:block}
#gate .desc{color:#777;font-size:.88rem;margin-bottom:30px;line-height:1.6}
.pw{position:relative;margin-bottom:18px}
.pw input{width:100%;padding:15px 50px 15px 18px;border:2px solid #e0e0e0;border-radius:12px;font-size:1rem;transition:.2s;outline:none;background:#fafafa}
.pw input:focus{border-color:#3949ab;background:#fff}
.pw button{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#aaa;font-size:1.1rem;padding:4px}
.pw button:hover{color:#555}
#gate .go{background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;border:none;padding:15px;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;width:100%;transition:.2s;letter-spacing:.3px}
#gate .go:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 6px 20px rgba(26,35,126,.35)}
#gate .go:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.m{padding:12px 16px;border-radius:10px;font-size:.85rem;margin-top:14px;display:none;line-height:1.5;text-align:left}
.m.e{display:block;background:#FFF0F0;color:#C62828;border:1px solid #FFCDD2}
.m.x{display:block;background:#FFF3E0;color:#BF360C;border:1px solid #FFE0B2}
.m.i{display:block;background:#E8EAF6;color:#283593;border:1px solid #C5CAE9}
.ft{margin-top:28px;font-size:.73rem;color:#bbb;line-height:1.5}
</style>
</head>
<body>
<div id="gate">
    <span class="icon">📊</span>
    <h1>Accounting Equation<br>Simulator — Complete Cycle</h1>
    <p class="desc">Please enter the access password<br>provided by your instructor.</p>
    <div class="pw">
        <input type="password" id="p" placeholder="Password" autocomplete="off" spellcheck="false">
        <button onclick="var i=document.getElementById('p');i.type=i.type==='password'?'text':'password'" title="Show / Hide">&#128065;</button>
    </div>
    <button class="go" id="gb" onclick="go()">Unlock</button>
    <div class="m" id="m"></div>
    <div class="ft">ACCT2101CO1 — Do Not Redistribute</div>
</div>
